
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#142B49">

  <title>Sin conexión | Asistencia CGR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #F4F7FB;
      color: #142B49;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(20, 43, 73, 0.10);
    }

    h1 {
      font-size: 24px;
    }

    p {
      line-height: 1.6;
      color: #475569;
    }

    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #142B49;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <h1>Sin conexión a Internet</h1>

    <p>
      No podemos conectar con el sistema de asistencia.
      Comprueba tu conexión e inténtalo nuevamente.
    </p>

    <p>
      No se ha registrado ninguna entrada ni salida
      por mostrar esta pantalla.
    </p>

    <button onclick="location.reload()">
      Intentar nuevamente
    </button>
  </main>
</body>
</html>
